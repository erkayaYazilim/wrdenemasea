<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Sinan Usta-Hoş Geldiniz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Font Awesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    /* Genel sıfırlama */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #383545;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .container {
      text-align: center;
      max-width: 600px;
      width: 100%;
      padding: 20px;
    }
    
    .logo-container {
      max-width: 100%;
      margin: 0 auto 20px;
    }
    .logo-container img {
      width: 100%;
      height: auto;
      object-fit: contain;
      border-radius: 10px;
      background-color: #ddd;
      border: 1px solid #ddd;
      padding: 5px;
      transition: all 0.4s ease;
    }
    
    #main-title {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #e53e3e;
    }
    #sub-title {
      font-size: 1.3rem;
      font-weight: normal;
      color: #ccc;
      margin-bottom: 10px;
    }
    #welcome-text {
      margin-bottom: 20px;
      font-size: 1.1rem;
    }
    
    .menu-button {
      background-color: #e53e3e;
      color: #fff;
      border: none;
      padding: 12px 24px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 1rem;
      transition: background-color 0.3s;
    }
    .menu-button:hover {
      background-color: #c53030;
    }
    
    @media (max-width: 480px) {
      #main-title {
        font-size: 1.8rem;
      }
      #sub-title {
        font-size: 1.2rem;
      }
      .menu-button {
        padding: 10px 20px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="sinanusta.png" alt="Restoran Logosu">
    </div>
    <h1 id="main-title">SİNAN USTA</h1>
    <h2 id="sub-title">Sarıyer Börekcisi</h2>
    <p id="welcome-text">Hoş geldiniz</p>
    <button id="menu-btn" class="menu-button">Menüye Git</button>
  </div>
  
  <script>
    // URL’deki "masa" parametresini yakala
    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    const masa = urlParams.get('masa');
    
    // Eğer masa parametresi varsa sessionStorage'a kaydet
    if (masa) {
      sessionStorage.setItem('masa', masa);
      console.log("Masa numarası tespit edildi:", masa);
    }
    
    // "Menüye Git" butonuna tıklayınca menu.html'e yönlendir
    document.getElementById("menu-btn").addEventListener("click", function() {
      window.location.href = "menu.html";
    });
  </script>
</body>
</html>
